<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Numbrick - BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stars"></div>

    <header class="navbar">
        <div class="logo-container">
            <img src="logo.png" alt="Numbrick Logo" class="logo-img">
        </div>
    
        <div class="menu-toggle" id="mobile-menu" onclick="toggleMobileMenu()">
            <i class="fa-solid fa-bars"></i>
        </div>

        <nav class="nav-links" id="nav-links">
            <button class="nav-btn" onclick="window.location.href='index.html'">Home</button>
            <button class="nav-btn" onclick="window.location.href='calc-view.html'">Calculator</button>
            <button class="nav-btn" onclick="window.location.href='unit-view.html'">Unit Converter</button>
            <button class="nav-btn" onclick="window.location.href='curr-view.html'">Currency Converter</button>
            <button class="nav-btn active" onclick="window.location.href='bmi-view.html'">BMI Calculator</button>
            <button class="nav-btn" onclick="window.location.href='age-view.html'">Age Calculator</button>
        </nav>
    </header>

    <header class="bmi-dashboard">
        <h1>BMI Calculator</h1>
    </header>

    <div class="dashboard bmi-view-layout">
        <div class="column">
            <div class="panel">
                <div class="form-group">
                    <label>Weight (kg)</label>
                    <input type="number" id="bmi-weight" placeholder="e.g. 70">
                </div>
                <div class="form-group">
                    <label>Height (cm)</label>
                    <input type="number" id="bmi-height" placeholder="e.g. 175">
                </div>
                <button class="submit-btn" onclick="calculateBMI()">Calculate BMI</button>
                <div class="result-box" id="bmi-result">BMI: --</div>
            </div>
        </div>
    </div>

    <footer class="signature">© 2026 Numbrick • Designed to Calculate • Crafted by Anwesha</footer>

    <script src="script.js"></script>
</body>
</html>
