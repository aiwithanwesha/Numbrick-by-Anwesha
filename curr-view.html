<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Numbrick - Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stars"></div>

    <header class="navbar">
        <div class="logo-container">
            <img src="logo.png" alt="Numbrick Logo" class="logo-img">
        </div>
        
        <!-- Mobile Menu Toggle Button -->
        <div class="menu-toggle" id="mobile-menu" onclick="toggleMobileMenu()">
            <i class="fa-solid fa-bars"></i>
        </div>

        <nav class="nav-links" id="nav-links">
            <button class="nav-btn" onclick="window.location.href='index.html'">Home</button>
            <button class="nav-btn" onclick="window.location.href='calc-view.html'">Calculator</button>
            <button class="nav-btn" onclick="window.location.href='unit-view.html'">Unit Converter</button>
            <button class="nav-btn active" onclick="window.location.href='curr-view.html'">Currency Converter</button>
            <button class="nav-btn" onclick="window.location.href='bmi-view.html'">BMI Calculator</button>
            <button class="nav-btn" onclick="window.location.href='age-view.html'">Age Calculator</button>
        </nav>
    </header>

    <header class="curr-dashboard">
        <h1>Currency Converter</h1>
    </header>

    <div class="dashboard curr-view-layout">
        <div class="column"> 
            <div class="panel">
                <div class="form-group">
                    <label>From</label>
                    <select id="curr-from" onchange="convertCurrency()">
                        <option value="USD">USD ($)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="INR">INR (₹)</option>
                        <option value="GBP">GBP (£)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>To</label>
                    <select id="curr-to" onchange="convertCurrency()">
                        <option value="INR">INR (₹)</option>
                        <option value="USD">USD ($)</option>
                        <option value="EUR">EUR (€)</option>
                        <option value="GBP">GBP (£)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" id="curr-value" placeholder="Enter amount" oninput="convertCurrency()">
                </div>
                <div class="result-box" id="curr-result">Result: 0</div>
            </div>
        </div>
    </div>

    <footer class="signature">© 2026 Numbrick • Designed to Calculate • Crafted by Anwesha</footer>

    <script src="script.js"></script>
</body>
</html>
