<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Numbrick - Unit Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="stars"></div>

    <header class="navbar">
        <div class="logo-container">
            <img src="logo.png" alt="Numbrick Logo" class="logo-img">
        </div>
        
        <!-- Mobile Menu Toggle Button -->
        <div class="menu-toggle" id="mobile-menu" onclick="toggleMobileMenu()">
            <i class="fa-solid fa-bars"></i>
        </div>

        <nav class="nav-links" id="nav-links">
            <button class="nav-btn" onclick="window.location.href='index.html'">Home</button>
            <button class="nav-btn" onclick="window.location.href='calc-view.html'">Calculator</button>
            <button class="nav-btn active" onclick="window.location.href='unit-view.html'">Unit Converter</button>
            <button class="nav-btn" onclick="window.location.href='curr-view.html'">Currency Converter</button>
            <button class="nav-btn" onclick="window.location.href='bmi-view.html'">BMI Calculator</button>
            <button class="nav-btn" onclick="window.location.href='age-view.html'">Age Calculator</button>
        </nav>
    </header>

    <header class="unit-dashboard">
        <h1>Unit Converter</h1>
    </header>

    <div class="dashboard unit-view-layout">
        <div class="column">
            <div class="panel">
                <div class="form-group">
                    <label>Category</label>
                    <select id="conv-type" onchange="updateUnits()">
                        <option value="length">Length</option>
                        <option value="weight">Weight</option>
                        <option value="temperature">Temperature</option>
                        <option value="area">Area</option>
                        <option value="volume">Volume</option>
                        <option value="time">Time</option>
                        <option value="speed">Speed</option>
                        <option value="data">Data</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>From</label>
                    <select id="conv-from" onchange="convertUnits()"></select>
                </div>
                <div class="form-group">
                    <label>To</label>
                    <select id="conv-to" onchange="convertUnits()"></select>
                </div>
                <div class="form-group">
                    <label>Value</label>
                    <input type="number" id="conv-value" placeholder="Enter value" oninput="convertUnits()">
                </div>
                <div class="result-box" id="conv-result">Result: 0</div>
            </div>
        </div>
    </div>

    <footer class="signature">© 2026 Numbrick • Designed to Calculate • Crafted by Anwesha</footer>

    <script src="script.js"></script>
</body>
</html>
